name: Performance Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Representative storage benchmarks
        run: |
          go test ./internal/similarity \
            -run '^$' \
            -bench '^BenchmarkSimilarityStoragePipeline$' \
            -benchmem \
            -count=5 | tee benchmark.txt

      - name: Enforce relative performance bounds
        run: bash scripts/check-performance.sh benchmark.txt

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-benchmark
          path: benchmark.txt
